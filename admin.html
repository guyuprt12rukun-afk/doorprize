<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mesin Panitia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Confetti untuk Efek Gebyar Kemenangan -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-6">
    <h1 class="text-2xl font-bold mb-6 border-b pb-2">MESIN - PANITIA</h1>

    <!-- Tab Navigasi -->
    <div class="flex space-x-4 mb-6">
      <button onclick="switchTab('dashboard')" class="px-4 py-2 bg-blue-600 text-white rounded">Dashboard</button>
      <button onclick="switchTab('setting')" class="px-4 py-2 bg-gray-200 rounded">Setting</button>
      <button onclick="switchTab('pendaftaran')" class="px-4 py-2 bg-gray-200 rounded">Pendaftaran</button>
      <button onclick="switchTab('mesin')" class="px-4 py-2 bg-gray-200 rounded">Mesin</button>
    </div>

    <!-- Section 1: Dashboard -->
    <div id="sec-dashboard" class="tab-content">
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
          <p class="text-gray-600">Jumlah Peserta</p>
          <p id="totalPeserta" class="text-3xl font-bold">0</p>
        </div>
        <div class="bg-green-50 p-4 rounded-lg border border-green-200">
          <p class="text-gray-600">Jumlah Pemenang</p>
          <p id="totalPemenang" class="text-3xl font-bold">0</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <h2 class="font-bold mb-2">Daftar Semua Peserta:</h2>
          <ul id="listPeserta" class="divide-y border rounded-lg p-2 bg-gray-50 max-h-60 overflow-y-auto"></ul>
        </div>
        <div>
          <h2 class="font-bold mb-2">Peserta Yang Menang:</h2>
          <ul id="listPemenang" class="divide-y border rounded-lg p-2 bg-gray-50 max-h-60 overflow-y-auto"></ul>
        </div>
      </div>
    </div>

    <!-- Section 2: Setting -->
    <div id="sec-setting" class="tab-content hidden space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Nama Kegiatan (Title):</label>
        <input type="text" id="cfgTitle" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">URL Background:</label>
        <input type="text" id="cfgBg" class="w-full border p-2 rounded" placeholder="https://...">
      </div>
      <button id="btnSaveSetting" class="bg-green-600 text-white px-4 py-2 rounded font-semibold">Simpan Pengaturan</button>
    </div>

    <!-- Section 3: Pendaftaran -->
    <div id="sec-pendaftaran" class="tab-content hidden max-w-xl mx-auto">
      <h2 class="text-xl font-bold mb-4 border-b pb-2">Form Pendaftaran Peserta</h2>
      <form id="formReg" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Nama Lengkap:</label>
          <input type="text" id="nama" placeholder="Masukkan nama..." class="w-full border p-2 rounded bg-white" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">NIK / Nomor Identitas:</label>
          <input type="text" id="nik" placeholder="Masukkan NIK..." class="w-full border p-2 rounded bg-white" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Alamat:</label>
          <input type="text" id="alamat" placeholder="Masukkan alamat..." class="w-full border p-2 rounded bg-white" required>
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-1">Foto Selfie Peserta:</label>
          <input type="file" id="fotoInput" accept="image/*" capture="user" class="w-full border p-2 rounded bg-white" required>
        </div>

        <div id="previewContainer" class="hidden text-center mt-2">
          <img id="imgPreview" class="w-32 h-32 object-cover rounded-full mx-auto border-2 border-blue-500 shadow">
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white py-2 rounded font-bold mt-2 hover:bg-blue-700">
          Daftar & Dapatkan Kupon
        </button>
      </form>
    </div>

    <!-- Section 4: Mesin Acak -->
    <div id="sec-mesin" class="tab-content hidden space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Nama Hadiah:</label>
        <input type="text" id="prizeInput" class="w-full border p-2 rounded" placeholder="Contoh: Sepeda Motor">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">URL Foto Hadiah:</label>
        <input type="text" id="prizeImgInput" class="w-full border p-2 rounded" placeholder="https://...">
      </div>
      <div class="flex space-x-4 pt-4">
        <button id="btnAcak" class="bg-green-600 text-white px-6 py-3 text-lg rounded font-bold hover:bg-green-700">ACAK</button>
        <button id="btnStop" class="bg-red-600 text-white px-6 py-3 text-lg rounded font-bold hover:bg-red-700">STOP</button>
      </div>
    </div>

  </div>

  <script type="module">
    import { db, ref, set, onValue, update, push } from './js/config.js';

    let participants = [];
    let timer = null;
    let photoBase64 = "";

    // Fungsi Pesta Gebyar Confetti Kemenangan
    function triggerVictoryEffects() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);
        // Hujan kertas dari sisi kiri dan kanan layar
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    // Navigasi Tab
    window.switchTab = (tab) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
    };

    // Baca Data Realtime Peserta
    onValue(ref(db, 'participants'), (snapshot) => {
      const data = snapshot.val();
      participants = data ? Object.keys(data).map(k => ({id: k, ...data[k]})) : [];
      
      document.getElementById('totalPeserta').innerText = participants.length;
      
      const listPesertaEl = document.getElementById('listPeserta');
      if (listPesertaEl) {
        listPesertaEl.innerHTML = participants
          .map(p => `<li class="py-2 px-1 flex justify-between border-b text-sm"><span>[${p.couponId}] <b>${p.name}</b></span> <span class="${p.isWinner ? 'text-green-600 font-bold' : 'text-gray-500'}">${p.isWinner ? '🏆 Menang' : 'Aktif'}</span></li>`)
          .join('');
      }

      const pemenang = participants.filter(p => p.isWinner);
      document.getElementById('totalPemenang').innerText = pemenang.length;
      document.getElementById('listPemenang').innerHTML = pemenang
        .map(p => `<li class="py-2 px-1 border-b text-sm"><b>[${p.couponId}] ${p.name}</b> - Hadiah: ${p.prizeName || '-'}</li>`)
        .join('');
    });

    // Simpan Pengaturan
    document.getElementById('btnSaveSetting').onclick = () => {
      update(ref(db, 'settings'), {
        title: document.getElementById('cfgTitle').value,
        bgUrl: document.getElementById('cfgBg').value
      });
      alert('Setting berhasil disimpan!');
    };

    // Preview & Kompres Foto Kamera
    document.getElementById('fotoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 300;
            const scaleFactor = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleFactor;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            photoBase64 = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('imgPreview').src = photoBase64;
            document.getElementById('previewContainer').classList.remove('hidden');
          };
        };
        reader.readAsDataURL(file);
      }
    });

    // Submit Form Pendaftaran
    document.getElementById('formReg').onsubmit = (e) => {
      e.preventDefault();

      if (!photoBase64) {
        alert("Silakan ambil foto selfie terlebih dahulu!");
        return;
      }

      const name = document.getElementById('nama').value;
      const nik = document.getElementById('nik').value;
      const alamat = document.getElementById('alamat').value;

      onValue(ref(db, 'participants'), (snap) => {
        const totalCount = snap.exists() ? Object.keys(snap.val()).length : 0;
        const couponId = String(totalCount + 1).padStart(3, '0');

        push(ref(db, 'participants'), {
          couponId: couponId,
          name: name,
          nik: nik,
          address: alamat,
          photoUrl: photoBase64,
          isWinner: false,
          isLocked: false
        }).then(() => {
          alert(`Pendaftaran Berhasil! Nomor Kupon: ${couponId}`);
          document.getElementById('formReg').reset();
          document.getElementById('previewContainer').classList.add('hidden');
          photoBase64 = "";
        });
      }, { onlyOnce: true });
    };

    // Logika Pengacak Doorprize
    document.getElementById('btnAcak').onclick = () => {
      const activeCandidates = participants.filter(p => !p.isLocked && !p.isWinner);
      if (activeCandidates.length === 0) return alert('Tidak ada peserta aktif tersisa!');

      const prizeName = document.getElementById('prizeInput').value || "Hadiah";
      const prizeImg = document.getElementById('prizeImgInput').value;

      timer = setInterval(() => {
        const rand = activeCandidates[Math.floor(Math.random() * activeCandidates.length)];
        set(ref(db, 'draw_state'), {
          status: 'SPINNING',
          currentPrize: prizeName,
          currentPrizeImg: prizeImg,
          activeParticipant: rand
        });
      }, 100);
    };

    document.getElementById('btnStop').onclick = () => {
      if (!timer) return;
      clearInterval(timer);
      timer = null;

      onValue(ref(db, 'draw_state'), (snapshot) => {
        const state = snapshot.val();
        if (state && state.activeParticipant && state.status === 'SPINNING') {
          const winner = state.activeParticipant;
          
          update(ref(db, `participants/${winner.id}`), {
            isWinner: true,
            isLocked: true,
            prizeName: state.currentPrize
          });

          update(ref(db, 'draw_state'), { status: 'STOPPED' });

          // Panggil Efek Gebyar Kemenangan
          triggerVictoryEffects();
        }
      }, { onlyOnce: true });
    };
  </script>
</body>
</html>
