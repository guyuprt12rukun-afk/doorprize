<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Undian Doorprize</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="bgBody" class="min-h-screen bg-cover bg-center flex flex-col justify-between p-8 text-white bg-slate-900">
  
  <header class="text-center">
    <h1 id="titleText" class="text-5xl font-bold drop-shadow-md">Doorprize</h1>
  </header>

  <main class="flex justify-around items-center my-auto">
    <!-- Area Hadiah -->
    <div class="text-center bg-black/40 p-6 rounded-xl backdrop-blur-md border border-white/20 w-1/3">
      <h2 id="prizeName" class="text-3xl font-bold mb-4">HADIAH</h2>
      <img id="prizeImg" src="https://via.placeholder.com/300?text=Foto+Hadiah" class="w-64 h-64 object-cover mx-auto rounded-lg border-2 border-white">
    </div>

    <!-- Area Acak Peserta -->
    <div class="text-center bg-black/40 p-6 rounded-xl backdrop-blur-md border border-white/20 w-1/3">
      <img id="participantPhoto" src="https://via.placeholder.com/200?text=Foto+Peserta" class="w-48 h-48 object-cover mx-auto rounded-full mb-4 border-4 border-yellow-400">
      <h3 id="participantName" class="text-3xl font-bold text-yellow-300">NAMA PESERTA</h3>
      <p id="participantCoupon" class="text-2xl mt-2 font-mono">No. Undian: -</p>
    </div>
  </main>

  <script type="module">
    import { db, ref, onValue } from './js/config.js';

    // Sinkronisasi Setting Tampilan
    onValue(ref(db, 'settings'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if(data.title) document.getElementById('titleText').innerText = data.title;
        if(data.bgUrl) document.getElementById('bgBody').style.backgroundImage = `url('${data.bgUrl}')`;
      }
    });

    // Sinkronisasi Kontrol Acak Realtime
    onValue(ref(db, 'draw_state'), (snapshot) => {
      const state = snapshot.val();
      if (state) {
        document.getElementById('prizeName').innerText = state.currentPrize || "HADIAH";
        if (state.currentPrizeImg) document.getElementById('prizeImg').src = state.currentPrizeImg;
        
        if (state.activeParticipant) {
          document.getElementById('participantName').innerText = state.activeParticipant.name || "---";
          document.getElementById('participantCoupon').innerText = "No. Undian: " + (state.activeParticipant.couponId || "---");
          if(state.activeParticipant.photoUrl) document.getElementById('participantPhoto').src = state.activeParticipant.photoUrl;
        }
      }
    });
  </script>
</body>
</html>
