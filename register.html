<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pendaftaran Online Peserta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-xl shadow-lg max-w-md w-full">
    <h2 class="text-xl font-bold text-center mb-4">PENDAFTARAN PESERTA</h2>
    <form id="formReg" class="space-y-3">
  <input type="text" id="nama" placeholder="Nama Lengkap" class="w-full border p-2 rounded" required>
  <input type="text" id="nik" placeholder="NIK / Nomor Identitas" class="w-full border p-2 rounded" required>
  <input type="text" id="alamat" placeholder="Alamat" class="w-full border p-2 rounded" required>
  
  <!-- Tombol Ambil Foto Selfie (Otomatis Buka Kamera HP) -->
  <div>
    <label class="block text-sm font-medium mb-1">Foto Selfie Peserta:</label>
    <input type="file" id="fotoInput" accept="image/*" capture="user" class="w-full border p-2 rounded bg-white" required>
  </div>

  <!-- Pratinjau Foto -->
  <div id="previewContainer" class="hidden text-center mt-2">
    <img id="imgPreview" class="w-32 h-32 object-cover rounded-full mx-auto border-2 border-blue-500 shadow">
  </div>

  <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white py-2 rounded font-bold mt-2">
    Daftar & Dapatkan Kupon
  </button>
</form>
    
    <div id="ticketResult" class="hidden text-center mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
      <p class="text-green-700 font-bold">Pendaftaran Berhasil!</p>
      <p class="text-gray-600 mt-2">Nomor Undian Anda:</p>
      <p id="myCoupon" class="text-4xl font-extrabold text-green-600 my-2">-</p>
      <a href="index.html" class="inline-block mt-2 text-sm text-blue-600 underline">Lihat Layar Undian Utama</a>
    </div>
  </div>

  <script type="module">
    import { db, ref, push, onValue } from './js/config.js';

    let totalCount = 0;
    onValue(ref(db, 'participants'), (snap) => {
      totalCount = snap.exists() ? Object.keys(snap.val()).length : 0;
    });

    document.getElementById('formReg').onsubmit = (e) => {
      e.preventDefault();
      const couponId = String(totalCount + 1).padStart(3, '0');
      const name = document.getElementById('nama').value;

      push(ref(db, 'participants'), {
        couponId: couponId,
        name: name,
        nik: document.getElementById('nik').value,
        address: document.getElementById('alamat').value,
        photoUrl: 'https://via.placeholder.com/200?text=' + encodeURIComponent(name),
        isWinner: false,
        isLocked: false
      });

      document.getElementById('formReg').classList.add('hidden');
      document.getElementById('myCoupon').innerText = couponId;
      document.getElementById('ticketResult').classList.remove('hidden');
    };

    let photoBase64 = "";

// Preview & Konversi Gambar saat foto diambil dari Kamera
document.getElementById('fotoInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      // Kecilkan resolusi gambar agar hemat penyimpanan Firebase
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 300; // Ukuran foto cukup 300px untuk display
        const scaleFactor = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scaleFactor;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // Hasil kompresi fotoBase64
        photoBase64 = canvas.toDataURL('image/jpeg', 0.7);

        // Tampilkan Preview Foto
        document.getElementById('imgPreview').src = photoBase64;
        document.getElementById('previewContainer').classList.remove('hidden');
      };
    };
    reader.readAsDataURL(file);
  }
});

// Simpan Data Pendaftaran ke Firebase
document.getElementById('formReg').onsubmit = (e) => {
  e.preventDefault();

  if (!photoBase64) {
    alert("Silakan ambil foto selfie terlebih dahulu!");
    return;
  }

  const name = document.getElementById('nama').value;
  const nik = document.getElementById('nik').value;
  const alamat = document.getElementById('alamat').value;

  // Baca jumlah total peserta untuk kupon (001, 002, dst.)
  onValue(ref(db, 'participants'), (snap) => {
    const totalCount = snap.exists() ? Object.keys(snap.val()).length : 0;
    const couponId = String(totalCount + 1).padStart(3, '0');

    push(ref(db, 'participants'), {
      couponId: couponId,
      name: name,
      nik: nik,
      address: alamat,
      photoUrl: photoBase64, // Menyimpan foto selfie peserta
      isWinner: false,
      isLocked: false
    }).then(() => {
      alert(`Pendaftaran Berhasil! Nomor Kupon Anda: ${couponId}`);
      document.getElementById('formReg').reset();
      document.getElementById('previewContainer').classList.add('hidden');
      photoBase64 = "";
    });
  }, { onlyOnce: true });
};
    
  </script>
</body>
</html>
